name: Build

on:
  push:
    # master است که شاخه‌ی پیش‌فرض این مخزن است و تا امروز در این فهرست نبود؛
    # main و develop هیچ‌کدام وجود ندارند. یعنی این workflow روی هیچ push ای به
    # master اجرا نمی‌شد و فقط از مسیر pull_request پایین کار می‌کرد - پس کامیتِ
    # حاصل از merge هر PR هیچ‌وقت build نمی‌شد. همان سه نام در
    # diagram-parity.yml درست فهرست شده‌اند و اینجا هم‌راستا می‌شود.
    branches:
      - master
      - main
      - develop

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: ./mvnw clean verify
