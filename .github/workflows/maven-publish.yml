name: Build

on:
  push:
    # master است که شاخه‌ی پیش‌فرض این مخزن است و تا امروز در این فهرست نبود؛
    # main و develop هیچ‌کدام وجود ندارند. یعنی این workflow روی هیچ push ای به
    # master اجرا نمی‌شد و فقط از مسیر pull_request پایین کار می‌کرد - پس کامیتِ
    # حاصل از merge هر PR هیچ‌وقت build نمی‌شد. همان سه نام در
    # diagram-parity.yml درست فهرست شده‌اند و اینجا هم‌راستا می‌شود.
    branches:
      - master
      - main
      - develop

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # تست‌های JavaScript (src/test/js) تا امروز در هیچ‌جا اجرا نمی‌شدند: نه این
      # workflow و نه pom.xml هیچ‌کدام node را صدا نمی‌زدند، پس money.test.js،
      # member-names.test.js و calendar.test.js فقط وقتی کسی دستی اجرایشان می‌کرد
      # کار می‌کردند. یک ثانیه طول می‌کشد و پیش از Maven می‌آید تا شکستش زود برسد.
      # گلاب صریح است (نه پوشه): Node 22 یک پوشه را به‌عنوان فایل اجرا می‌کند و
      # fail می‌دهد. نسخه‌ی ۲۲ همان نسخه‌ای است که تست‌ها با آن نوشته شده‌اند.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript tests
        run: node --test src/test/js/*.test.js

      - name: Build
        run: ./mvnw clean verify
