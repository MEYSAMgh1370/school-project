name: CodeQL

# جایگزین «Default setup» گیت‌هاب: آن حالت JDK قدیمی‌تری می‌گذاشت و
# «release version 21 not supported» می‌داد. اینجا همان JDK ای که build.yml
# استفاده می‌کند نصب می‌شود. پیش‌شرط: Default setup در
# Settings > Advanced Security خاموش شود (با فعال بودن هر دو، آپلود رد می‌شود).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 25

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile (tests are skipped; the Build workflow runs them)
        if: matrix.language == 'java-kotlin'
        run: ./mvnw -B -DskipTests -Dmaven.test.skip=true clean package

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
