name: Claude code review

# Runs the official code-review plugin on every pull request and posts the
# findings as inline comments on the lines they concern. Claude skips drafts,
# closed PRs, and PRs it judges too trivial to review, so the job is cheap on
# small changes. The check never blocks a merge.
#
# Authentication: this expects a CLAUDE_CODE_OAUTH_TOKEN repository secret
# (generated with `claude setup-token`, billed to the Claude subscription).
# To bill a Claude API key instead, replace that line with:
#   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the review still running on the old commit.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action starts the inline-comment MCP server only when
          # --allowedTools names it, even though the skill's own frontmatter does.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
