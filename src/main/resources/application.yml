spring:
  application:
    name: roshdeandishe

  # یادآوری معماری: طبق نیازمندی پروژه، هر ماژول دیتابیس PostgreSQL مجزای خود را دارد.
  # در این فاز اسکلت، یک دیتاسورس مشترک تعریف شده تا پروژه بالا بیاید؛
  # در فاز بعدی (تنظیمات Multi-DataSource) سه DataSource جدا برای iam, academic, finance
  # با @ConfigurationProperties و @Primary مشخص خواهد شد - این کار نیازمند
  # کلاس‌های پیکربندی جداگانه (DataSourceConfig) در هر ماژول است.
  #
  # ⚠️ نکته‌ی مهم Postgres: Hibernate با ddl-auto=update فقط جدول‌ها را
  # می‌سازد، نه خود schema را. چون SchoolEntity با schema="school"،
  # FinanceAuditEntity با schema="finance"، ClassEntity/StudentEntity با
  # schema="academic"، و حالا BaleLinkEntity با schema="bale" تعریف
  # شده‌اند، قبل از اجرای اپلیکیشن باید این schemaها را دستی بسازید:
  #   CREATE SCHEMA IF NOT EXISTS school;
  #   CREATE SCHEMA IF NOT EXISTS finance;
  #   CREATE SCHEMA IF NOT EXISTS academic;
  #   CREATE SCHEMA IF NOT EXISTS bale;
  datasource:
    url: jdbc:postgresql://localhost:5432/roshdeandishe_iam
    username: postgres
    password: postgres

  jpa:
    hibernate:
      # توجه: validate در نسخه‌ی قبلی بود؛ چون پروژه هنوز در فاز dev است و
      # migration رسمی (Flyway/Liquibase) معرفی نشده، فعلاً روی update
      # گذاشته شده تا جدول‌های جدید (users, roles, school_memberships,
      # modules, school_entitlements, user_entitlements) خودکار ساخته شوند.
      # قبل از نزدیک شدن به production، حتماً باید Flyway اضافه و این مقدار
      # به validate برگردانده شود.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_schema: iam

  # ارسال ایمیل دعوت/فعال‌سازی (iam/internal/InviteEmailSender).
  # پیش‌فرض dev: یک SMTP محلی مثل Mailpit/MailHog روی پورت 1025
  # (docker run -p 1025:1025 -p 8025:8025 axllent/mailpit).
  # اگر SMTP در دسترس نباشد، صدور توکن شکست نمی‌خورد - فقط emailSent=false
  # برمی‌گردد و ادمین مثل قبل لینک را دستی تحویل می‌دهد.
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  modulith:
    events:
      # ثبت رویدادهای منتشرشده در دیتابیس برای قابلیت Retry/Audit
      jdbc-schema-initialization:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith

logging:
  level:
    org.springframework.modulith: DEBUG

gg:
  jte:
    use-precompiled-templates: true

# CSRF فعال است (SecurityConfig)؛ این تنظیم به Swagger UI می‌گوید کوکی
# XSRF-TOKEN را بخواند و در هدر X-XSRF-TOKEN بفرستد تا try-it-outهای
# تغییردهنده (POST/PUT) در dev همچنان کار کنند.
springdoc:
  swagger-ui:
    csrf:
      enabled: true

roshdeandishe:
  mail:
    # آدرس فرستنده‌ی ایمیل‌های سیستم
    from: no-reply@roshdeandishe.test
    # پایه‌ی لینک فعال‌سازی که داخل ایمیل دعوت قرار می‌گیرد
    # (به /activate?token=... ختم می‌شود)
    activation-base-url: http://localhost:8080
  bale:
    # Bot API بله - عمداً کلون Telegram Bot API (همان شکل .../bot<token>/METHOD)
    api-base-url: https://tapi.bale.ai
    # پیش‌فرض خالی: تا وقتی یک ربات واقعی در بله ثبت نشود (کانفیگ زمان
    # استقرار)، BaleClient فقط لاگ می‌کند و هیچ تماس HTTPای برقرار نمی‌کند
    # (رجوع به bale/internal/BaleClient) - بالا نیامدن اپلیکیشن روی این
    # مقدار وابسته نیست.
    bot-token: ""
    # بخش مخفیِ مسیر وب‌هوک (BaleWebhookController) - در dev هم باید یک
    # مقدار تصادفیِ واقعی در محیط/فایل جداگانه ست شود؛ خالی ماندنش یعنی
    # وب‌هوک همیشه 404 می‌دهد (رجوع به کامنت‌های BaleWebhookController)
    webhook-secret: ""
  jwt:
    # صدور/اعتبارسنجی توکن Bearer برای اپ موبایل (additive به session cookie
    # وب - iam.internal.JwtTokenProvider). این مقدار dev-only است؛ در
    # deployment واقعی باید از طریق env var override شود، همان الگوی
    # roshdeandishe.bale.bot-token. کلید HMAC-SHA256، حداقل ۲۵۶ بیت.
    secret: xYpDz1+SLoB2muDdXqrUsLpIKOZyZf1qqZW6hX336PM=
    # طول عمر توکن: ۱۲ ساعت. عمداً بدون refresh-token در v1 - نبود
    # sync/push در پس‌زمینه یعنی لاگین مجدد روزانه هزینه‌ی UX پذیرفتنی‌ای
    # است؛ اگر در عمل مزاحم شد، آن‌وقت refresh token اضافه شود، نه از قبل.
    expiration-seconds: 43200
