spring:
  application:
    name: roshdeandishe

  # یادآوری معماری: طبق نیازمندی پروژه، هر ماژول دیتابیس PostgreSQL مجزای خود را دارد.
  # در این فاز اسکلت، یک دیتاسورس مشترک تعریف شده تا پروژه بالا بیاید؛
  # در فاز بعدی (تنظیمات Multi-DataSource) سه DataSource جدا برای iam, academic, finance
  # با @ConfigurationProperties و @Primary مشخص خواهد شد - این کار نیازمند
  # کلاس‌های پیکربندی جداگانه (DataSourceConfig) در هر ماژول است.
  #
  # ساخت دستیِ schemaها دیگر لازم نیست: از وقتی Flyway اضافه شده (بخش
  # spring.flyway پایین)، خودِ Flyway هر هشت schema را از روی لیست
  # spring.flyway.schemas می‌سازد. کافی است دیتابیس خالی وجود داشته باشد.
  datasource:
    url: jdbc:postgresql://localhost:5432/roshdeandishe_iam
    username: postgres
    password: postgres

  # Flyway مالکِ schema است (CLAUDE.md §12؛ §7 مورد ۵ با همین تغییر بسته شد).
  # مهاجرت‌ها در src/main/resources/db/migration، هر تغییر Entity نیازمند یک
  # فایل V<n>__... جدید است و فایلِ اعمال‌شده هرگز ویرایش نمی‌شود.
  flyway:
    enabled: true
    # هر هشت schemaی ماژول‌ها. Flyway هر کدام را که نباشد می‌سازد - همان
    # کاری که تا امروز باید دستی با CREATE SCHEMA انجام می‌شد. اولین مورد
    # لیست، محلِ جدول flyway_schema_history هم هست.
    schemas: iam,school,academic,finance,bale,curriculum,studyplan,exam
    default-schema: iam
    # برای دیتابیس‌هایی که از قبل با ddl-auto=update ساخته شده‌اند (dev فعلی
    # و استقرار Liara): جدول‌ها موجودند ولی flyway_schema_history نیست، پس
    # Flyway آن‌ها را در نسخه‌ی ۱ baseline می‌کند و V1 را - که دقیقاً همان
    # جدول‌ها را می‌سازد - رد می‌کند. روی دیتابیس خالی این تنظیم بی‌اثر است
    # و V1 عادی اجرا می‌شود.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # ddl-auto دیگر جدول نمی‌سازد. validate یعنی اگر مدل Entity و schemaی
      # واقعی از هم فاصله بگیرند (یک فیلد جدید بدون فایل مهاجرت)، اپلیکیشن
      # همان لحظه fail می‌کند - نه اینکه بی‌صدا ستون اضافه کند.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: iam

  # ارسال ایمیل دعوت/فعال‌سازی (iam/internal/InviteEmailSender).
  # پیش‌فرض dev: یک SMTP محلی مثل Mailpit/MailHog روی پورت 1025
  # (docker run -p 1025:1025 -p 8025:8025 axllent/mailpit).
  # اگر SMTP در دسترس نباشد، صدور توکن شکست نمی‌خورد - فقط emailSent=false
  # برمی‌گردد و ادمین مثل قبل لینک را دستی تحویل می‌دهد.
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      # سقف واقعیِ ۵ مگابایتیِ پیوست هزینه (ExpenseFacadeImpl) عمداً پایین‌تر
      # از این مقدارهاست: رد شدن از این سقف باید یک 400 دامنه‌ای
      # (invalid-attachment) بدهد، نه یک 500 خام از MaxUploadSizeExceededException
      # که این حد پایین‌تر از سقف container جلوی آن را می‌گیرد.
      max-file-size: 6MB
      max-request-size: 8MB

  modulith:
    events:
      # ثبت رویدادهای منتشرشده در دیتابیس برای قابلیت Retry/Audit
      jdbc-schema-initialization:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith

logging:
  level:
    org.springframework.modulith: DEBUG

gg:
  jte:
    use-precompiled-templates: true

# CSRF فعال است (SecurityConfig)؛ این تنظیم به Swagger UI می‌گوید کوکی
# XSRF-TOKEN را بخواند و در هدر X-XSRF-TOKEN بفرستد تا try-it-outهای
# تغییردهنده (POST/PUT) در dev همچنان کار کنند.
springdoc:
  swagger-ui:
    csrf:
      enabled: true

roshdeandishe:
  finance:
    # سررسید پیش‌فرض فاکتور شهریه: صدور + این تعداد روز. عمداً سراسری، نه
    # per-school - سررسید مدرسه‌به‌مدرسه هنوز توسط کسی خواسته نشده (YAGNI).
    default-due-days: 14
  mail:
    # آدرس فرستنده‌ی ایمیل‌های سیستم
    from: no-reply@roshdeandishe.test
    # پایه‌ی لینک فعال‌سازی که داخل ایمیل دعوت قرار می‌گیرد
    # (به /activate?token=... ختم می‌شود)
    activation-base-url: http://localhost:8080
  bale:
    # Bot API بله - عمداً کلون Telegram Bot API (همان شکل .../bot<token>/METHOD)
    api-base-url: https://tapi.bale.ai
    # پیش‌فرض خالی: تا وقتی یک ربات واقعی در بله ثبت نشود (کانفیگ زمان
    # استقرار)، BaleClient فقط لاگ می‌کند و هیچ تماس HTTPای برقرار نمی‌کند
    # (رجوع به bale/internal/BaleClient) - بالا نیامدن اپلیکیشن روی این
    # مقدار وابسته نیست.
    bot-token: ""
    # بخش مخفیِ مسیر وب‌هوک (BaleWebhookController) - در dev هم باید یک
    # مقدار تصادفیِ واقعی در محیط/فایل جداگانه ست شود؛ خالی ماندنش یعنی
    # وب‌هوک همیشه 404 می‌دهد (رجوع به کامنت‌های BaleWebhookController)
    webhook-secret: ""
  sms:
    # ارسال کد تأیید پیامکی برای ورود با شماره تلفن (iam.internal.SmsDriver).
    # پیش‌فرض خالی: تا وقتی یک ارائه‌دهنده‌ی واقعی پیامک انتخاب/پیکربندی
    # نشود (کانفیگ زمان استقرار، نه کد گم‌شده)، SmsDriver فقط لاگ می‌کند و
    # هیچ تماس HTTPای برقرار نمی‌کند - همان الگوی roshdeandishe.bale.bot-token.
    api-key: ""
  jwt:
    # صدور/اعتبارسنجی توکن Bearer برای اپ موبایل (additive به session cookie
    # وب - iam.internal.JwtTokenProvider). این مقدار dev-only است؛ در
    # deployment واقعی باید از طریق env var override شود، همان الگوی
    # roshdeandishe.bale.bot-token. کلید HMAC-SHA256، حداقل ۲۵۶ بیت.
    secret: xYpDz1+SLoB2muDdXqrUsLpIKOZyZf1qqZW6hX336PM=
    # طول عمر توکن: ۱۲ ساعت. عمداً بدون refresh-token در v1 - نبود
    # sync/push در پس‌زمینه یعنی لاگین مجدد روزانه هزینه‌ی UX پذیرفتنی‌ای
    # است؛ اگر در عمل مزاحم شد، آن‌وقت refresh token اضافه شود، نه از قبل.
    expiration-seconds: 43200
  exam:
    # صدور/اعتبارسنجی توکن جلسه‌ی آزمون‌دهی (exam.internal.ExamTokenService) -
    # یک JWT سومِ کاملاً مستقل با کلید امضای جدا، نه کوکی سشن وب و نه JWT
    # موبایل (roshdeandishe.jwt.secret بالا) - همان جداییِ صریحی که
    # MOSHAVERE_PORT_SPEC.md §5 برای این توکن خواسته. عمر این توکن ثابت
    # نیست: به ازای هر Attempt از min(startedAt+duration آزمون, پایان آزمون)
    # محاسبه می‌شود (رجوع به ExamFacadeImpl.startAttempt)، پس نیازی به
    # expiration-seconds جدا اینجا نیست. مقدار dev-only؛ در deployment واقعی
    # باید از طریق env var override شود، همان الگوی roshdeandishe.jwt.secret.
    token-secret: l8pLv5cMPMXo4s+HioWZX9ohrxKAi87A+Hl+OzOpTcE=
