<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">IAM C4 Level 1 System Context</title>
  <desc id="desc">Roshdeandishe users and external systems interacting with the Spring Boot school management system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .person { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .system { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .external { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .db { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 400 12px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720"/>
  <text class="title" x="48" y="54">IAM C4 - Level 1: System Context</text>
  <text class="subtitle" x="48" y="80">Who uses the system, and which external systems IAM touches.</text>

  <rect class="person" x="70" y="135" width="210" height="58" rx="8"/>
  <text class="label" x="95" y="162">School admin</text>
  <text class="small" x="95" y="181">Manages school users</text>

  <rect class="person" x="70" y="225" width="210" height="58" rx="8"/>
  <text class="label" x="95" y="252">Teacher</text>
  <text class="small" x="95" y="271">Uses protected APIs</text>

  <rect class="person" x="70" y="315" width="210" height="58" rx="8"/>
  <text class="label" x="95" y="342">Student or parent</text>
  <text class="small" x="95" y="361">Uses my endpoints</text>

  <rect class="person" x="70" y="405" width="210" height="58" rx="8"/>
  <text class="label" x="95" y="432">Mobile app user</text>
  <text class="small" x="95" y="451">Authenticates by JWT</text>

  <rect class="person" x="70" y="495" width="210" height="58" rx="8"/>
  <text class="label" x="95" y="522">Bale bot</text>
  <text class="small" x="95" y="541">Webhook integration</text>

  <rect class="system" x="455" y="260" width="300" height="128" rx="10"/>
  <text class="label" x="507" y="307">Roshdeandishe</text>
  <text class="small" x="491" y="332">Spring Boot modular monolith</text>
  <text class="small" x="494" y="354">IAM owns identity and access</text>

  <path class="edge" d="M 280 164 C 345 164, 385 276, 455 296"/>
  <text class="edge-label" x="312" y="151">Session login + admin APIs</text>

  <path class="edge" d="M 280 254 C 350 254, 390 292, 455 310"/>
  <text class="edge-label" x="320" y="247">Session login</text>

  <path class="edge" d="M 280 344 C 350 344, 390 335, 455 331"/>
  <text class="edge-label" x="313" y="364">Self-service APIs</text>

  <path class="edge" d="M 280 434 C 355 434, 388 376, 455 354"/>
  <text class="edge-label" x="316" y="431">Bearer JWT</text>

  <path class="edge" d="M 280 524 C 352 524, 390 399, 455 373"/>
  <text class="edge-label" x="315" y="523">Webhook</text>

  <path class="db" d="M 920 124 h150 a22 22 0 0 1 0 44 h-150 a22 22 0 0 1 0 -44 z"/>
  <path class="db" d="M 898 146 v58 a97 26 0 0 0 194 0 v-58" fill="none"/>
  <ellipse class="db" cx="995" cy="146" rx="97" ry="26"/>
  <text class="label" x="945" y="153">PostgreSQL</text>
  <text class="small" x="910" y="196">iam schema tables</text>

  <rect class="external" x="885" y="304" width="220" height="66" rx="8"/>
  <text class="label" x="937" y="333">SMTP server</text>
  <text class="small" x="924" y="353">Activation emails</text>

  <rect class="external" x="885" y="454" width="220" height="66" rx="8"/>
  <text class="label" x="937" y="483">SMS provider</text>
  <text class="small" x="944" y="503">OTP delivery</text>

  <path class="edge" d="M 755 292 C 810 235, 850 178, 898 162"/>
  <text class="edge-label" x="785" y="230">users, roles, memberships, entitlements</text>

  <path class="edge" d="M 755 326 H 885"/>
  <text class="edge-label" x="775" y="315">best-effort invite email</text>

  <path class="edge" d="M 755 365 C 812 406, 840 476, 885 487"/>
  <text class="edge-label" x="775" y="435">OTP code delivery</text>
</svg>
