<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">IAM C4 Level 3 Components</title>
  <desc id="desc">IAM controllers, security aspects, facade, services, and persistence tables.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .group-title { font: 700 16px Arial, sans-serif; fill: #334155; }
      .api { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .security { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .platform { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .service { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .store { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .label { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, sans-serif; fill: #334155; }
      .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge2 { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 400 11px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="920"/>
  <text class="title" x="48" y="54">IAM C4 - Level 3: Components</text>
  <text class="subtitle" x="48" y="80">Implemented IAM components and their main dependencies.</text>

  <rect class="group" x="52" y="118" width="304" height="286" rx="10"/>
  <text class="group-title" x="76" y="148">HTTP entry points</text>

  <rect class="api" x="82" y="174" width="244" height="44" rx="7"/>
  <text class="label" x="146" y="202">AuthController</text>
  <rect class="api" x="82" y="236" width="244" height="44" rx="7"/>
  <text class="label" x="151" y="264">MeController</text>
  <rect class="api" x="82" y="298" width="244" height="44" rx="7"/>
  <text class="label" x="119" y="326">MembershipController</text>
  <rect class="api" x="82" y="360" width="244" height="44" rx="7"/>
  <text class="label" x="149" y="388">RoleController</text>

