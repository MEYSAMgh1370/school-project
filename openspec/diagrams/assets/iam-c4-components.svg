  <rect class="service" x="812" y="656" width="250" height="52" rx="7"/>
  <text class="label" x="877" y="685">IamSeedDataRunner</text>
  <text class="small" x="827" y="734">Seeds modules, system roles, permissions,</text>
  <text class="small" x="827" y="754">role-permission grants, and dev demo data.</text>

