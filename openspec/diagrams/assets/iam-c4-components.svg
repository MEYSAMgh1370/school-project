  <rect class="api" x="442" y="178" width="244" height="50" rx="7"/>
  <text class="label" x="508" y="207">IamFacade</text>
  <rect class="api" x="442" y="242" width="244" height="36" rx="7"/>
  <text class="small" x="475" y="264">AccessContext / AccessDecision</text>

