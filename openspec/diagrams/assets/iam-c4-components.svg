  <text class="small" x="1190" y="414">role_permissions</text>
  <rect class="store" x="1174" y="444" width="144" height="38" rx="7"/>
  <text class="small" x="1197" y="468">iam.modules</text>
  <rect class="store" x="1174" y="498" width="144" height="38" rx="7"/>
  <text class="small" x="1188" y="522">school_entitlements</text>
  <rect class="store" x="1174" y="552" width="144" height="38" rx="7"/>
  <text class="small" x="1192" y="576">user_entitlements</text>
  <rect class="store" x="1174" y="606" width="144" height="38" rx="7"/>
  <text class="small" x="1194" y="630">invite_tokens</text>
  <rect class="store" x="1174" y="660" width="144" height="38" rx="7"/>
  <text class="small" x="1186" y="684">verification_codes</text>

  <path class="edge" d="M 326 196 H 442"/>
  <path class="edge" d="M 326 258 H 442"/>
  <path class="edge" d="M 326 320 H 442"/>
  <path class="edge" d="M 326 382 H 442"/>
  <text class="edge-label" x="354" y="184">calls facade</text>

  <rect class="group" x="410" y="572" width="308" height="88" rx="10"/>
