  <text class="edge-label" x="1090" y="192">reads/writes</text>

  <rect x="52" y="835" width="1296" height="48" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text class="small" x="76" y="864">Spring Security establishes identity only. IAM aspects enforce module entitlement and permission using active memberships and role-permission rows.</text>
</svg>
