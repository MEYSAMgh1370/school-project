  <text class="group-title" x="76" y="468">Security and tenancy</text>

  <rect class="security" x="82" y="494" width="244" height="40" rx="7"/>
  <text class="label" x="145" y="519">SecurityConfig</text>
  <rect class="security" x="82" y="548" width="244" height="40" rx="7"/>
  <text class="label" x="110" y="573">JwtAuthenticationFilter</text>
