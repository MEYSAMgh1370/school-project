  <path class="edge2" d="M 1062 283 H 1174"/>
  <path class="edge2" d="M 1062 353 H 1174"/>
  <path class="edge2" d="M 1062 682 C 1108 682, 1126 463, 1174 463"/>
  <path class="edge2" d="M 1062 682 C 1112 682, 1126 355, 1174 355"/>
  <path class="edge2" d="M 1062 682 C 1112 682, 1126 409, 1174 409"/>

  <path class="edge2" d="M 1062 283 C 1118 283, 1118 463, 1174 463"/>
  <path class="edge2" d="M 1062 283 C 1118 283, 1118 517, 1174 517"/>
  <path class="edge2" d="M 1062 353 C 1118 353, 1118 247, 1174 247"/>
  <path class="edge2" d="M 1062 353 C 1118 353, 1118 355, 1174 355"/>
  <path class="edge2" d="M 1062 353 C 1118 353, 1118 409, 1174 409"/>

  <path class="edge2" d="M 1062 283 C 1126 283, 1126 571, 1174 571"/>
